services:
  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      PORT: 3000
      DATABASE_URL: postgres://manugent:manugent_password@db:5432/manugent
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: manugent
      POSTGRES_USER: manugent
      POSTGRES_PASSWORD: manugent_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manugent -d manugent"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
