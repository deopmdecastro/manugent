services:
  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: development
      # Liga ao PostgreSQL local — Supabase não necessário em dev
      DATABASE_URL: postgres://manugent:manugent_password@db:5432/manugent
      # Limpa SUPABASE_URL/KEY para forçar o pg-adapter (preenche no .env para usar Supabase)
      SUPABASE_URL: ""
      SUPABASE_ANON_KEY: ""
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: manugent
      POSTGRES_USER: manugent
      POSTGRES_PASSWORD: manugent_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manugent -d manugent"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
